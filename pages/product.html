<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product – Ambaji textiles</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/product.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

<div class="announcement-bar">🌿 Free shipping on orders above ₹1,299 &nbsp;|&nbsp; Handcrafted by artisans across India</div>

<header class="site-header">
  <div class="header-inner">
    <nav class="header-nav left-nav">
      <a href="shop.html">Shop</a>
      
      <a href="about.html">Our Story</a>
    </nav>
    <a href="../index.html" class="logo">
      <span class="logo-main">Ambaji textiles</span>
      <span class="logo-sub">Surat, Gujarat</span>
    </a>
    <div class="header-actions">
      <a href="cart.html" class="icon-btn cart-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </div>
</header>

<div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span>/</span><a href="shop.html">Shop</a><span>/</span><span id="prodBreadcrumb">Product</span></nav>
</div>

<div class="product-detail container" id="productDetail">
  <div class="pd-gallery">
    <div class="pd-main-img" id="mainImg"></div>
    <div class="pd-thumbs" id="thumbs"></div>
  </div>
  <div class="pd-info">
    <div id="prodContent"></div>
  </div>
</div>

<!-- RECENTLY VIEWED / YOU MAY LIKE -->
<section class="featured-section" style="padding-top:0;">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">You might also like</h2>
    </div>
    <div class="product-grid" id="relatedGrid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,0.1);">
    <div class="container"><p>@ 2026 Ambaji textiles. All rights reserved.</p></div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="../js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'));
  const product = PRODUCTS.find(p => p.id === id) || PRODUCTS[0];

  document.title = `${product.name} – Ambaji textiles`;
  document.getElementById('prodBreadcrumb').textContent = product.name;

  // Main image
  document.getElementById('mainImg').innerHTML = `
  <img src="../${product.images[0]}"
       alt="${product.name}"
       style="width:100%;height:auto;border-radius:8px;">
`;

document.getElementById('thumbs').innerHTML = `
  <div class="thumb active" onclick="selectThumb(this)">
    <img src="../${product.images[0]}"
         alt="${product.name}"
         style="width:100%;height:100%;object-fit:cover;">
  </div>
`;

  // Product info
  document.getElementById('prodContent').innerHTML = `
    ${product.badge ? `<span class="product-badge ${product.badge === 'sale' ? 'badge-sale' : 'badge-new'}" style="position:relative;top:auto;left:auto;display:inline-block;margin-bottom:12px">${product.badge === 'sale' ? 'SALE' : 'NEW ARRIVAL'}</span>` : ''}
    <h1 class="pd-title">${product.name}</h1>
    <p class="pd-weave">${product.weave}</p>
    <div class="pd-price">
      ${product.originalPrice ? `<span class="original">₹${product.originalPrice.toLocaleString('en-IN')}</span>` : ''}
      <span class="current ${product.originalPrice ? 'discounted' : ''}">₹${product.price.toLocaleString('en-IN')}</span>
    </div>
    <p class="pd-desc">${product.description}</p>
    <div class="pd-actions">
      <div class="qty-control">
        <button onclick="changeQty(-1)">−</button>
        <span id="qtyDisplay">1</span>
        <button onclick="changeQty(1)">+</button>
      </div>
      <button class="btn btn-primary pd-atc" onclick="addToCart(${product.id})">Add to Cart</button>
      <button class="btn btn-ghost pd-wishlist" onclick="wishlistAdd(${product.id})" title="Wishlist">♡</button>
    </div>
    <a href="cart.html" class="btn btn-outline btn-full" style="margin-top:10px">Buy Now</a>
    <div class="pd-meta">
      <div class="meta-item">✅ In Stock · Ships in 2–3 business days</div>
      <div class="meta-item">🔄 14-day returns on unworn sarees</div>
      <div class="meta-item">📦 Free shipping above ₹1,299</div>
    </div>
    <div class="pd-details">
      <h4>Product Details</h4>
      <ul>${product.details.map(d => `<li>${d}</li>`).join('')}</ul>
    </div>
  `;

  // Related
  const related = PRODUCTS.filter(p => p.id !== product.id && (p.category === product.category || p.tags.some(t => product.tags.includes(t)))).slice(0, 4);
  document.getElementById('relatedGrid').innerHTML = related.map(buildProductCard).join('');
});

function changeQty(delta) {
  const el = document.getElementById('qtyDisplay');
  let v = parseInt(el.textContent) + delta;
  if (v < 1) v = 1;
  if (v > 10) v = 10;
  el.textContent = v;
}

function selectThumb(el) {
  document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
